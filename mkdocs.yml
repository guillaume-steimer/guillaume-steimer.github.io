site_name: Guillaume Steimer Homepage
site_url: https://guillaume-steimer.github.io/

markdown_extensions:
  - attr_list

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      primary: teal        # bleu/turquoise profond, ambiance sous-marine
      accent: amber        # accent chaud, bronze/or
      scheme: default
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: teal        # bleu sombre, sous-marin
      accent: amber        # accent chaud
      scheme: slate
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Research: research.md
  - Teaching: teaching.md
  - CV: CV.md

plugins:
  - search
  - print-site






